name: dev-websocket-acceptance-diagnostics

on:
  push:
    branches: [ci/websocket-acceptance-20260820]

permissions:
  contents: write

concurrency:
  group: dev-websocket-acceptance-20260820
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/websocket-acceptance-20260820
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply, test, and publish result
        shell: bash
        run: |
          set +e
          rm -f .ci-websocket-status.txt .ci-websocket.log
          status=0

          echo '===== extract implementation patch =====' | tee .ci-websocket.log
          python3 <<'PY' 2>&1 | tee -a .ci-websocket.log
          from pathlib import Path
          text = Path('.github/workflows/dev-websocket-acceptance.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          block = text[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          ) + "\n"
          Path('/tmp/apply-websocket.py').write_text(script)
          PY
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then status=$rc; fi

          if [ "$status" -eq 0 ]; then
            echo '===== apply implementation patch =====' | tee -a .ci-websocket.log
            python3 /tmp/apply-websocket.py 2>&1 | tee -a .ci-websocket.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then status=$rc; fi
          fi

          if [ "$status" -eq 0 ]; then
            echo '===== apply patch corrections =====' | tee -a .ci-websocket.log
            python3 .github/ws-fix.py 2>&1 | tee -a .ci-websocket.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then status=$rc; fi
          fi

          run_check() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a .ci-websocket.log
            "$@" 2>&1 | tee -a .ci-websocket.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "FAILED: $name (exit $rc)" | tee -a .ci-websocket.log
              status=$rc
            fi
          }

          if [ "$status" -eq 0 ]; then run_check format cargo fmt --all; fi
          if [ "$status" -eq 0 ]; then run_check format-check cargo fmt --all -- --check; fi
          if [ "$status" -eq 0 ]; then run_check diff-check git diff --check; fi
          if [ "$status" -eq 0 ]; then run_check check cargo check --all-targets; fi
          if [ "$status" -eq 0 ]; then run_check clippy cargo clippy --all-targets -- -D warnings; fi
          if [ "$status" -eq 0 ]; then run_check tests cargo test --all-targets; fi
          if [ "$status" -eq 0 ]; then run_check release cargo build --release; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -eq 0 ]; then
            echo PASS > .ci-websocket-status.txt
            git rm -f --ignore-unmatch .ci-websocket-status.txt .ci-websocket.log >/dev/null 2>&1 || true
            git add -- Cargo.toml Cargo.lock README.md src/main.rs src/server.rs src/upstream.rs src/websocket.rs
            if ! git diff --cached --quiet; then
              git commit -m "feat: proxy Codex Responses over WebSocket"
              git push origin HEAD:ci/websocket-acceptance-20260820
            fi
            exit 0
          fi

          echo FAIL > .ci-websocket-status.txt
          git add -- .ci-websocket-status.txt .ci-websocket.log
          git commit -m "ci: record websocket acceptance failure"
          git push origin HEAD:ci/websocket-acceptance-20260820
          exit "$status"
