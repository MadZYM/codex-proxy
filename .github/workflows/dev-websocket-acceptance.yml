                  tracing::error!(%error, "upstream websocket client unavailable");
              }
              let user_agent = build_user_agent(&cfg.originator, &cfg.cli_version);
          ''',
              )
              replace_once(
                  "src/upstream.rs",
                  '''        Self {
                  http,
