name: dev-websocket-acceptance

on:
  push:
    branches: [ci/websocket-acceptance-20260820]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-accept:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@v4
        with:
          ref: ci/websocket-acceptance-20260820
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply minimal WebSocket proxy implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new))

          if not Path("src/websocket.rs").exists():
              replace_once(
                  "Cargo.toml",
                  'tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }\naxum = { version = "0.7", features = ["json"] }',
                  'tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }\naxum = { version = "0.7", features = ["json", "ws"] }',
              )
              replace_once(
                  "Cargo.toml",
                  'reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "http2", "json", "stream", "gzip", "brotli", "zstd", "deflate", "socks"] }\n',
                  'reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "http2", "json", "stream", "gzip", "brotli", "zstd", "deflate", "socks"] }\n# Reuses the configured reqwest client for an HTTP/1.1 WebSocket upgrade, so\n# CODEXPROXY_PROXY applies to WebSocket handshakes as well as HTTP and OAuth.\nreqwest-websocket = "0.5.1"\n',
              )

              replace_once(
                  "src/main.rs",
                  "mod upstream;\n",
                  "mod upstream;\nmod websocket;\n",
              )

              replace_once(
                  "src/server.rs",
                  "use axum::extract::{DefaultBodyLimit, Path, Request, State};\n",
                  "use axum::extract::ws::WebSocketUpgrade;\nuse axum::extract::{DefaultBodyLimit, Path, Request, State};\n",
              )
              replace_once(
                  "src/server.rs",
                  '''        .route(
                      "/v1/responses",
                      post(responses).route_layer(auth_layer.clone()),
                  )
          ''',
                  '''        .route(
                      "/v1/responses",
                      get(responses_websocket)
                          .post(responses)
                          .route_layer(auth_layer.clone()),
                  )
          ''',
              )
              replace_once(
                  "src/server.rs",
                  '''/// Passthrough to the Codex Responses API. Streams the upstream response back
          /// to the client as-is (preserving SSE).
          async fn responses(
          ''',
                  '''/// Transparent Responses WebSocket proxy. The downstream upgrade is accepted
          /// immediately so an official Codex client can preconnect; the upstream handshake is
          /// opened after the first `response.create` frame, which supplies the model/service tier
          /// needed for the current official `x-codex-routing-hint` format.
          async fn responses_websocket(
              State(state): State<AppState>,
              Extension(ctx): Extension<AccessCtx>,
              headers: HeaderMap,
              ws: WebSocketUpgrade,
          ) -> Response {
              let max_message_bytes = state.config.server.max_body_bytes;
              let upstream = state.upstream.clone();
              let metrics = state.metrics.clone();
              ws.max_message_size(max_message_bytes)
                  .max_frame_size(max_message_bytes)
                  .on_upgrade(move |socket| async move {
                      crate::websocket::proxy_responses(
                          socket,
                          upstream,
                          headers,
                          ctx,
                          metrics,
                          max_message_bytes,
                      )
                      .await;
                  })
          }

          /// Passthrough to the Codex Responses API. Streams the upstream response back
