              replace_once(
                  "src/upstream.rs",
                  '''    /// Try one pool account: send once, and if the upstream says 401, force a
              /// token refresh and retry once more on this same account before
              /// reporting it as failed.
              async fn try_account(
          ''',
                  '''    /// Open an upstream Responses WebSocket using the model/service tier in
              /// the first downstream `response.create` frame. The frame itself is not
              /// consumed or rewritten here; the relay sends the original bytes after the
              /// handshake succeeds.
              pub async fn connect_responses_websocket(
                  &self,
                  first_payload: &[u8],
                  client_headers: &reqwest::header::HeaderMap,
              ) -> Result<ForwardedWebSocket, WebSocketConnectError> {
                  let routing_hint = build_routing_hint_header(first_payload);
                  let pool_len = self.pool.len();
                  let mut tried = vec![false; pool_len];
                  let mut last_error = None;

                  for _ in 0..pool_len {
                      let (idx, auth_mgr, account) = self.next_account();
                      if tried[idx] {
                          break;
                      }
                      tried[idx] = true;

                      match self
                          .try_account_websocket(
                              &auth_mgr,
                              &account,
                              client_headers,
                              routing_hint.as_ref(),
                          )
                          .await
                      {
                          Ok(WebSocketAttempt::Connected(websocket)) => {
                              return Ok(ForwardedWebSocket { websocket, account });
                          }
                          Ok(WebSocketAttempt::Rejected { status, body }) => {
                              let error = WebSocketConnectError {
                                  status: status.as_u16(),
                                  message: format!(
                                      "upstream websocket handshake rejected for account {account} ({status}): {}",
                                      compact_error_body(&body)
                                  ),
                              };
                              if is_account_failure(status) {
                                  self.pool[idx].start_cooldown(self.account_cooldown);
                                  tracing::warn!(
                                      %account,
                                      %status,
                                      "websocket account handshake failed, trying next pool account"
                                  );
                                  last_error = Some(error);
                                  continue;
                              }
                              return Err(error);
                          }
                          Err(error) => {
                              self.pool[idx].start_cooldown(self.account_cooldown);
                              tracing::warn!(
                                  %account,
                                  error = %error,
                                  "websocket account transport/auth failed, trying next pool account"
                              );
                              last_error = Some(WebSocketConnectError {
                                  status: reqwest::StatusCode::BAD_GATEWAY.as_u16(),
                                  message: error.to_string(),
                              });
                          }
                      }
                  }

                  Err(last_error.unwrap_or_else(|| WebSocketConnectError {
                      status: reqwest::StatusCode::BAD_GATEWAY.as_u16(),
                      message: "upstream websocket account pool is empty".to_string(),
                  }))
              }

              async fn try_account_websocket(
                  &self,
                  auth_mgr: &AuthManager,
                  account: &str,
                  client_headers: &reqwest::header::HeaderMap,
                  routing_hint: Option<&reqwest::header::HeaderValue>,
              ) -> Result<WebSocketAttempt, ProxyError> {
                  let auth = auth_mgr.headers().await?;
                  let attempt = self
                      .send_websocket_once(&auth, client_headers, routing_hint, account)
                      .await?;
                  if !matches!(
                      attempt,
                      WebSocketAttempt::Rejected {
                          status: reqwest::StatusCode::UNAUTHORIZED,
                          ..
                      }
                  ) {
                      return Ok(attempt);
                  }

                  tracing::info!(
                      %account,
                      "401 from websocket handshake; forcing token refresh and retrying once"
                  );
                  let refreshed = auth_mgr.force_refresh_headers().await?;
                  self.send_websocket_once(&refreshed, client_headers, routing_hint, account)
                      .await
              }

              async fn send_websocket_once(
                  &self,
                  auth: &crate::auth::AuthHeaders,
                  client_headers: &reqwest::header::HeaderMap,
                  routing_hint: Option<&reqwest::header::HeaderValue>,
                  account: &str,
              ) -> Result<WebSocketAttempt, ProxyError> {
                  let client = self.websocket_http.as_ref().map_err(|message| {
                      ProxyError::Upstream(format!("upstream websocket unavailable: {message}"))
                  })?;
                  let mut req = client
                      .get(&self.responses_websocket_url)
                      .header("Authorization", format!("Bearer {}", auth.bearer))
                      .header("originator", &self.originator)
                      .header("User-Agent", &self.user_agent)
                      .header(
                          "OpenAI-Beta",
                          RESPONSES_WEBSOCKETS_V2_BETA_HEADER_VALUE,
                      );

                  if let Some(account_id) = &auth.account_id {
                      req = req.header("ChatGPT-Account-ID", account_id.clone());
                  }
                  if let Some(routing_hint) = routing_hint {
                      req = req.header(X_CODEX_ROUTING_HINT_HEADER, routing_hint.clone());
                  }
                  for name in SESSION_IDENTITY_HEADERS {
                      if let Some(value) = client_headers.get(*name) {
                          req = req.header(*name, value.clone());
                      }
                  }
                  if self.pool.len() == 1 {
                      for name in STICKY_ROUTING_REQUEST_HEADERS {
                          if let Some(value) = client_headers.get(*name) {
                              req = req.header(*name, value.clone());
                          }
                      }
                  }

                  let upgrade = req.upgrade().send().await.map_err(|error| {
                      tracing::warn!(%account, error = %error, "websocket handshake failed");
                      ProxyError::Upstream(format!("websocket handshake failed: {error}"))
                  })?;
                  let status = upgrade.status();
                  if status != reqwest::StatusCode::SWITCHING_PROTOCOLS {
                      let body = upgrade
                          .into_inner()
                          .text()
                          .await
                          .unwrap_or_else(|error| format!("failed to read rejection body: {error}"));
                      return Ok(WebSocketAttempt::Rejected { status, body });
                  }

                  let websocket = upgrade.into_websocket().await.map_err(|error| {
                      ProxyError::Upstream(format!(
                          "websocket upgrade validation failed for account {account}: {error}"
                      ))
                  })?;
                  Ok(WebSocketAttempt::Connected(websocket))
              }

              /// Try one pool account: send once, and if the upstream says 401, force a
              /// token refresh and retry once more on this same account before
              /// reporting it as failed.
              async fn try_account(
          ''',
              )
              replace_once(
                  "src/upstream.rs",
                  '''const X_CODEX_ROUTING_HINT_HEADER: &str = "x-codex-routing-hint";

          /// Generate the ChatGPT Codex routing hint using the exact current upstream format:
          ''',
                  '''const X_CODEX_ROUTING_HINT_HEADER: &str = "x-codex-routing-hint";
          const RESPONSES_WEBSOCKETS_V2_BETA_HEADER_VALUE: &str =
              "responses_websockets=2026-02-06";

          fn build_websocket_http_client(
              cfg: &UpstreamConfig,
          ) -> Result<reqwest::Client, reqwest::Error> {
              let mut builder = reqwest::Client::builder()
                  .use_rustls_tls()
                  .http1_only()
                  .pool_max_idle_per_host(4)
                  .tcp_keepalive(Duration::from_secs(30))
                  .connect_timeout(Duration::from_secs(cfg.connect_timeout_secs))
                  .read_timeout(Duration::from_secs(cfg.request_timeout_secs));
              if let Some(proxy_url) = &cfg.proxy {
                  builder = builder.proxy(reqwest::Proxy::all(proxy_url)?);
              }
              builder.build()
          }

          fn websocket_url(http_url: &str) -> String {
              if let Some(rest) = http_url.strip_prefix("https://") {
                  format!("wss://{rest}")
              } else if let Some(rest) = http_url.strip_prefix("http://") {
                  format!("ws://{rest}")
              } else {
                  http_url.to_string()
              }
          }

          fn compact_error_body(body: &str) -> String {
              const MAX_CHARS: usize = 4096;
              let mut chars = body.chars();
              let compact: String = chars.by_ref().take(MAX_CHARS).collect();
              if chars.next().is_some() {
                  format!("{compact}…")
              } else if compact.is_empty() {
                  "<empty body>".to_string()
              } else {
                  compact
              }
          }

          /// Generate the ChatGPT Codex routing hint using the exact current upstream format:
          ''',
              )
              replace_once(
                  "src/upstream.rs",
                  '''    "x-openai-memgen-request",
          ];
          ''',
                  '''    "x-openai-memgen-request",
              "x-responsesapi-include-timing-metrics",
          ];
          ''',
              )

              replace_once(
                  "README.md",
                  '''- `POST /v1/responses` — raw passthrough to the Codex Responses API.
          - `GET /v1/models`, `GET /health`.
          ''',
                  '''- `POST /v1/responses` — raw HTTP/SSE passthrough to the Codex Responses API.
          - `GET /v1/responses` with a WebSocket Upgrade — transparent official Codex
            Responses WebSocket transport; multiple `response.create` frames, prewarm,
            incremental `previous_response_id`, tools, reasoning, and unknown events pass through.
          - `GET /v1/models`, `GET /health`.
          ''',
              )
              replace_once(
                  "README.md",
                  '''For ChatGPT Codex upstream requests it generates the official
          `x-codex-routing-hint` from the raw body's `model` and optional `service_tier`;
          the body itself remains byte-for-byte unchanged. `x-codex-turn-state` only gets
          ''',
                  '''For ChatGPT Codex upstream requests it generates the official
          `x-codex-routing-hint` from the raw HTTP body's, or the first WebSocket
          `response.create` frame's, `model` and optional `service_tier`; payloads remain
          unchanged. The WebSocket handshake and OAuth refresh use the same
          `CODEXPROXY_PROXY` configuration as HTTP/SSE. `x-codex-turn-state` only gets
          ''',
              )

              Path("src/websocket.rs").write_text(r'''//! Transparent downstream <-> upstream Codex Responses WebSocket relay.
          //!
          //! The only frame inspection is read-only: the first `response.create` supplies
          //! the routing-hint model/tier, and `response.completed` supplies access-log token
          //! usage. Every frame is otherwise forwarded without JSON reconstruction, preserving
          //! tools, reasoning/encrypted reasoning, prewarm, incremental requests, and unknown
          //! current or future events.

          use std::sync::Arc;

          use axum::extract::ws::{CloseFrame, Message as DownstreamMessage, WebSocket};
          use axum::http::HeaderMap;
          use futures_util::{SinkExt, StreamExt};
          use reqwest_websocket::{CloseCode, Message as UpstreamMessage};
          use serde_json::json;

          use crate::metrics::Metrics;
          use crate::observe::{AccessCtx, CompletionLog};
          use crate::upstream::{ForwardedWebSocket, Upstream, WebSocketConnectError};

          pub(crate) async fn proxy_responses(
              mut downstream: WebSocket,
              upstream: Arc<Upstream>,
              client_headers: HeaderMap,
              ctx: AccessCtx,
              metrics: Arc<Metrics>,
              max_message_bytes: usize,
          ) {
              let first = match receive_first_request(&mut downstream, max_message_bytes).await {
                  Ok(Some(message)) => message,
                  Ok(None) => return,
                  Err(message) => {
                      let log = CompletionLog::new(
                          ctx,
                          "/v1/responses",
                          "-",
                          "-",
                          metrics,
                      );
                      send_proxy_error(&mut downstream, 400, &message).await;
                      log.emit(400, None);
                      return;
                  }
              };
              let first_payload = data_payload(&first)
                  .expect("first websocket request is always a data frame")
                  .to_vec();
              let model = request_model(&first_payload).unwrap_or_else(|| "-".to_string());
              let mut log = CompletionLog::new(ctx, "/v1/responses", model, "-", metrics);

              let ForwardedWebSocket {
                  mut websocket,
                  account,
              } = match upstream
                  .connect_responses_websocket(&first_payload, &client_headers)
                  .await
              {
                  Ok(forwarded) => forwarded,
                  Err(error) => {
                      send_connect_error(&mut downstream, &error).await;
                      log.emit(error.status, None);
                      return;
                  }
              };
              log.set_account(account);

              let mut usage = None;
              let result = relay_frames(&mut downstream, &mut websocket, first, &mut usage).await;
              match result {
                  Ok(()) => log.emit(101, usage),
                  Err(error) => {
                      send_proxy_error(&mut downstream, 502, &error).await;
                      log.emit(502, usage);
                  }
              }
          }

          async fn receive_first_request(
              downstream: &mut WebSocket,
              max_message_bytes: usize,
          ) -> Result<Option<DownstreamMessage>, String> {
              while let Some(message) = downstream.recv().await {
                  let message = message.map_err(|error| error.to_string())?;
                  match message {
                      data @ (DownstreamMessage::Text(_) | DownstreamMessage::Binary(_)) => {
                          let size = data_payload(&data).map_or(0, <[u8]>::len);
                          if size > max_message_bytes {
                              let _ = downstream
                                  .send(DownstreamMessage::Close(Some(CloseFrame {
                                      code: 1009,
                                      reason: "response.create frame exceeds configured limit".into(),
                                  })))
                                  .await;
                              return Err(format!(
                                  "websocket request frame is {size} bytes; limit is {max_message_bytes}"
                              ));
                          }
                          return Ok(Some(data));
                      }
                      DownstreamMessage::Ping(payload) => {
                          downstream
                              .send(DownstreamMessage::Pong(payload))
                              .await
                              .map_err(|error| error.to_string())?;
                      }
                      DownstreamMessage::Pong(_) => {}
                      DownstreamMessage::Close(frame) => {
                          let _ = downstream.send(DownstreamMessage::Close(frame)).await;
                          return Ok(None);
                      }
                  }
              }
              Ok(None)
          }

          async fn relay_frames(
              downstream: &mut WebSocket,
              upstream: &mut reqwest_websocket::WebSocket,
              first: DownstreamMessage,
              usage: &mut Option<(i64, i64)>,
          ) -> Result<(), String> {
              upstream
                  .send(downstream_to_upstream(first))
                  .await
                  .map_err(|error| format!("sending first upstream frame failed: {error}"))?;

              loop {
                  tokio::select! {
                      downstream_message = downstream.recv() => {
                          let Some(downstream_message) = downstream_message else {
                              let _ = upstream.send(UpstreamMessage::Close {
                                  code: CloseCode::Normal,
                                  reason: String::new(),
                              }).await;
                              return Ok(());
                          };
                          let downstream_message = downstream_message
                              .map_err(|error| format!("reading downstream websocket failed: {error}"))?;
                          let is_close = matches!(downstream_message, DownstreamMessage::Close(_));
                          upstream
                              .send(downstream_to_upstream(downstream_message))
                              .await
                              .map_err(|error| format!("sending upstream websocket frame failed: {error}"))?;
                          if is_close {
                              return Ok(());
                          }
                      }
                      upstream_message = upstream.next() => {
                          let Some(upstream_message) = upstream_message else {
                              let _ = downstream.send(DownstreamMessage::Close(Some(CloseFrame {
                                  code: 1000,
                                  reason: String::new().into(),
                              }))).await;
                              return Ok(());
                          };
                          let upstream_message = upstream_message
                              .map_err(|error| format!("reading upstream websocket failed: {error}"))?;
                          if let UpstreamMessage::Text(text) = &upstream_message
                              && let Some(completed_usage) = completed_usage(text)
                          {
                              *usage = Some(completed_usage);
                          }
                          let is_close = matches!(upstream_message, UpstreamMessage::Close { .. });
                          downstream
                              .send(upstream_to_downstream(upstream_message))
                              .await
                              .map_err(|error| format!("sending downstream websocket frame failed: {error}"))?;
                          if is_close {
                              return Ok(());
                          }
                      }
                  }
              }
          }

          fn data_payload(message: &DownstreamMessage) -> Option<&[u8]> {
              match message {
                  DownstreamMessage::Text(text) => Some(text.as_bytes()),
                  DownstreamMessage::Binary(bytes) => Some(bytes.as_ref()),
                  _ => None,
              }
          }

          fn request_model(payload: &[u8]) -> Option<String> {
              serde_json::from_slice::<serde_json::Value>(payload)
                  .ok()?
                  .get("model")?
                  .as_str()
                  .map(str::to_string)
          }

          fn completed_usage(payload: &str) -> Option<(i64, i64)> {
              let event: serde_json::Value = serde_json::from_str(payload).ok()?;
              if event.get("type")?.as_str()? != "response.completed" {
                  return None;
              }
              let usage = event.get("response")?.get("usage")?;
              Some((
                  usage.get("input_tokens")?.as_i64()?,
                  usage.get("output_tokens")?.as_i64()?,
              ))
          }

          fn downstream_to_upstream(message: DownstreamMessage) -> UpstreamMessage {
              match message {
                  DownstreamMessage::Text(text) => UpstreamMessage::Text(text),
                  DownstreamMessage::Binary(bytes) => UpstreamMessage::Binary(bytes.into()),
                  DownstreamMessage::Ping(bytes) => UpstreamMessage::Ping(bytes.into()),
                  DownstreamMessage::Pong(bytes) => UpstreamMessage::Pong(bytes.into()),
                  DownstreamMessage::Close(Some(frame)) => UpstreamMessage::Close {
                      code: frame.code.into(),
                      reason: frame.reason.into_owned(),
                  },
                  DownstreamMessage::Close(None) => UpstreamMessage::Close {
                      code: CloseCode::Normal,
                      reason: String::new(),
                  },
              }
          }

          fn upstream_to_downstream(message: UpstreamMessage) -> DownstreamMessage {
              match message {
                  UpstreamMessage::Text(text) => DownstreamMessage::Text(text),
                  UpstreamMessage::Binary(bytes) => DownstreamMessage::Binary(bytes.to_vec()),
                  UpstreamMessage::Ping(bytes) => DownstreamMessage::Ping(bytes.to_vec()),
                  UpstreamMessage::Pong(bytes) => DownstreamMessage::Pong(bytes.to_vec()),
                  UpstreamMessage::Close { code, reason } => {
                      DownstreamMessage::Close(Some(CloseFrame {
                          code: u16::from(code),
                          reason: reason.into(),
                      }))
                  }
              }
          }

          async fn send_connect_error(downstream: &mut WebSocket, error: &WebSocketConnectError) {
              send_proxy_error(downstream, error.status, &error.message).await;
          }

          async fn send_proxy_error(downstream: &mut WebSocket, status: u16, message: &str) {
              let payload = json!({
                  "type": "error",
                  "status": status,
                  "error": {
                      "type": "upstream_error",
                      "code": "websocket_proxy_error",
                      "message": message,
                  }
              })
              .to_string();
              let _ = downstream.send(DownstreamMessage::Text(payload)).await;
              let _ = downstream
                  .send(DownstreamMessage::Close(Some(CloseFrame {
                      code: 1011,
                      reason: "upstream websocket proxy failed".into(),
                  })))
                  .await;
          }

