        run: cargo build --release

      - name: Commit tested implementation to acceptance branch
        shell: bash
        run: |
          if git diff --quiet -- Cargo.toml Cargo.lock README.md src/main.rs src/server.rs src/upstream.rs src/websocket.rs; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.toml Cargo.lock README.md src/main.rs src/server.rs src/upstream.rs src/websocket.rs
