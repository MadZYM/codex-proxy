          }

          impl Upstream {
          ''',
                  '''pub struct ForwardedResponse {
              pub response: reqwest::Response,
              pub account: Arc<str>,
          }

          /// A live upstream Responses WebSocket bound to the pool account that
          /// authenticated its handshake. The account stays fixed for the lifetime
